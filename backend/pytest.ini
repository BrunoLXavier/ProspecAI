# pytest.ini
# Pytest configuration file

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Verbose output
addopts = 
    --verbose
    -p no:warnings

# Ignore directories
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    alembic
